name: ci

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: a1s
          POSTGRES_PASSWORD: a1s
          POSTGRES_DB: a1s_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U a1s"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
        env:
          A1S_TEST_DSN: postgres://a1s:a1s@127.0.0.1:5432/a1s_test?sslmode=disable

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/e2e-chaos.sh
